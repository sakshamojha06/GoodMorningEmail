name: Run Email Automation

on:
  schedule:
    - cron: '0 1 * * *' 
  workflow_dispatch:     

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create Credentials JSON
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > credentials/service-account.json

      - name: Create Credentials and Data Directory
        run: |
          mkdir -p credentials
          mkdir -p data  # 👈 Apne database folder ka naam yahan likho (e.g. data, database, DB)
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > credentials/service-account.json

      - name: Execute Application
        env:
          GOOGLE_CLOUD_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
          GOOGLE_SECRET_ID: ${{ secrets.GOOGLE_SECRET_ID }}
          GOOGLE_SECRET_VERSION: ${{ secrets.GOOGLE_SECRET_VERSION }}
          GOOGLE_SERVICE_ACCOUNT_FILE: credentials/service-account.json
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python app.py