# 🔑 Credentials folder & JSON file create karo
      - name: Create Credentials Directory and JSON File
        run: |
          mkdir -p credentials
          echo '${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}' > credentials/service-account.json

      # 🚀 Main script run karo
      - name: Run Main Application
        env:
          GOOGLE_CLOUD_PROJECT_ID: ${{ secrets.GOOGLE_CLOUD_PROJECT_ID }}
          GOOGLE_SECRET_ID: ${{ secrets.GOOGLE_SECRET_ID }}
          GOOGLE_SECRET_VERSION: ${{ secrets.GOOGLE_SECRET_VERSION }}
          GOOGLE_SERVICE_ACCOUNT_FILE: credentials/service-account.json
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python app.py